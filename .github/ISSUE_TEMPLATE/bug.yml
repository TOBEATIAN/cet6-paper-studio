name: Bug：运行或生成问题
description: 报告安装、生成中断、保存、播放或界面故障
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 在“设置”或安装包文件名中查看
      placeholder: 0.3.13
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 从打开软件开始，按顺序写下每一步
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与错误信息
      description: 请粘贴错误码、失败阶段和诊断文字，不要粘贴 API Key
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或诊断信息
      description: 可拖入截图；提交前遮住个人信息、API Key 和完整本地路径
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除 API Key、账号和个人隐私信息
          required: true
